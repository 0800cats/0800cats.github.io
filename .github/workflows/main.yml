name: Build and deploy Zola website
on:
  push:
    branches:
      - main  # Asegúrate de cambiar esto a "master" si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # ESTE PASO CLONAL EL TEMA DIRECTAMENTE EN LA MÁQUINA VIRTUAL
      - name: Clone Terminus Theme
        run: |
          mkdir -p themes
          git clone https://github.com themes/terminus

      - name: Build Zola + upload Pages artifact
        uses: getzola/github-pages@v1
        with:
          zola_version: v0.22.1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4